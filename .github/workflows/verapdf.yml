name: PDF/A & PDF/UA-2 (veraPDF)

# Validates that generated PDFs are genuinely conformant.
# Runs in a separate workflow so a veraPDF install hiccup never blocks the
# main Rust test suite.

on:
  push:
    branches: [main, devel]
  pull_request:
    branches: [main]


# O workflow apenas valida conteúdo do repositório; não necessita de escrever
# no repositório, emitir tokens ou aceder a segredos.
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  VERAPDF_VER: "1.30.2"
  VERAPDF_SERIES: "1.30"
  VERAPDF_SHA256: "6cc6341cb1af644044054b81f00a6590a7918abb18f762243de115258bcad838"
  VERAPDF_HOME: "/home/runner/verapdf"

jobs:
  verapdf:
    name: veraPDF conformance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-verapdf-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ubuntu-verapdf-cargo-

      # Java 17 is needed to run the veraPDF installer and the veraPDF CLI.
      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # veraPDF uses an IzPack installer.  We drive it non-interactively with
      # an auto-install XML (IzPack 5 "automated installation" format).
      # O instalador NAO existe nas releases do GitHub — o repositorio
      # veraPDF-apps so publica tags de build. A origem oficial e
      # software.verapdf.org. O ficheiro e fixado por sha256.
      - name: Install veraPDF ${{ env.VERAPDF_VER }}
        run: |
          set -euo pipefail
          zip="verapdf-greenfield-${VERAPDF_VER}-installer.zip"
          curl -fsSL --retry 3 --retry-delay 5 -o "$zip" \
            "https://software.verapdf.org/releases/${VERAPDF_SERIES}/${zip}"
          echo "${VERAPDF_SHA256}  $zip" | sha256sum -c -
          unzip -q "$zip"

          # A instalacao automatizada por XML nao funciona neste instalador:
          # os paineis sao HTMLHelloPanel/TargetPanel/PacksPanel/InstallPanel/
          # FinishPanel e o helper de automacao aborta sem diagnostico. O modo
          # consola e o caminho suportado. Sequencia de respostas, validada
          # contra a 1.30.2:
          #   1        continuar do ecra inicial
          #   <path>   caminho de instalacao
          #   O        confirmar criacao do diretorio
          #   1        continuar para a selecao de pacotes
          #   Y x5     incluir todos os pacotes opcionais
          #   1 1      concluir
          # Ao subir de versao, reconfirmar a sequencia: um prompt novo
          # dessincroniza as respostas e o instalador termina com
          # "You have not selected any packs!".
          printf '1\n%s\nO\n1\nY\nY\nY\nY\nY\n1\n1\n' "${VERAPDF_HOME}" \
            | java -jar \
              "verapdf-greenfield-${VERAPDF_VER}/verapdf-izpack-installer-${VERAPDF_VER}.jar" \
              -console

          # O executavel fica na raiz da instalacao, nao em bin/.
          test -x "${VERAPDF_HOME}/verapdf"
          echo "${VERAPDF_HOME}" >> "$GITHUB_PATH"

      - name: Verify veraPDF installation
        run: verapdf --version

      # Build verify-pdf (the Rust CLI that wraps veraPDF and produces
      # human-readable + exit-code output).
      - name: Build verify-pdf
        run: cargo build --package verify-pdf

      # Each `cargo run --example` also compiles the example if needed.
      - name: Generate PDF/A-1b  [example 12_compliance]
        run: cargo run --example 12_compliance

      - name: Generate PDF/UA-2  [example 13_accessibility]
        run: cargo run --example 13_accessibility

      # Validate PDF/A-1b.  Exit code 1 if veraPDF reports failures.
      - name: Validate PDF/A-1b
        run: |
          target/debug/verify-pdf /tmp/normordis_pdfa.pdf \
            --flavour 1b \
            --pdfa-only

      # Validate PDF/A-2b — o documento com marca de água translúcida usa o
      # perfil que permite transparência (o PDF/A-1 proíbe-a e a biblioteca
      # recusa essa combinação).
      - name: Validate PDF/A-2b
        run: |
          target/debug/verify-pdf /tmp/normordis_pdfa2b.pdf \
            --flavour 2b \
            --pdfa-only

      # Validate PDF/UA-2.  The -f ua2 flag requires veraPDF 1.30+.
      - name: Validate PDF/UA-2
        run: |
          target/debug/verify-pdf /tmp/normordis_accessible.pdf \
            --ua-only

      # ── Spike ADR-005 (docs/architecture/DECISIONS.md) ────────────────
      # Existe só na branch spike/krilla. Mede a pergunta 1 do plano em
      # docs/architecture/spike-krilla-plano.md: um PDF/A-4f gerado com
      # krilla passa veraPDF? Não faz parte da API pública nem do CI de
      # main — remover estes dois passos (e tools/spike-krilla) se o
      # spike terminar em rejeição.
      - name: Generate PDF/A-4f via krilla  [ADR-005 spike]
        run: cargo run --package spike-krilla

      - name: Validate PDF/A-4f (krilla spike)  [ADR-005]
        run: |
          target/debug/verify-pdf /tmp/spike_krilla_a4f.pdf \
            --flavour 4f \
            --pdfa-only
