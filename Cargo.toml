[workspace]
members = [
    ".",
    "tools/dotx2ndt",
    "tools/ndt-tools",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "EUPL-1.2"
version = "2.4.0"
authors = ["Carlos Canuto Costa"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "fast-rng", "serde"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
tempfile = "3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[package]
name = "normordis-pdf"
version = "2.4.0"
edition.workspace = true
license = "EUPL-1.2"
authors.workspace = true
description = "Institutional PDF generation for Portuguese public administration"
repository = "https://github.com/carloscanutocosta/normordis-pdf"
keywords = ["pdf", "institutional", "portugal", "public-admin", "normaxis"]
categories = ["rendering", "template-engine"]
exclude = ["examples/templates/*.pdf"]

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
chrono.workspace = true
pdf-writer = "0.12"
subsetter = "0.2"
flate2 = "1"
image = { version = "0.25", features = ["png", "jpeg"] }
rustybuzz = "0.20"
ttf-parser = "0.25"
regex = "1"
thiserror.workspace = true
serde = { workspace = true }
serde_json = { version = "1", features = ["preserve_order"] }
uuid.workspace = true
hex.workspace = true
toml = "0.8"
fontdb = { version = "0.23", optional = true }
hyphenation = { version = "0.8", features = ["embed_all"], optional = true }
sha2 = "0.10"
base64 = { workspace = true }

[features]
default = []
optimal_wrap = []
system-fonts = ["dep:fontdb"]
hyphenation = ["dep:hyphenation"]

[dev-dependencies]
tempfile.workspace = true
lopdf = "0.39"

