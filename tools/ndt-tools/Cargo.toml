[package]
name = "ndt-tools"
version = "0.1.0"
edition.workspace = true
description = "CLI tools for working with NDT (NORMORDIS Document Template) files"
license = "EUPL-1.2"

[[bin]]
name = "ndt-tools"
path = "src/main.rs"

[dependencies]
normordis-pdf = { path = "../.." }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
toml = "0.8"
lopdf = "0.39"
anyhow = "1"

